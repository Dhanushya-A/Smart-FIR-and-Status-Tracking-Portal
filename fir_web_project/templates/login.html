{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100" style="background: linear-gradient(135deg, #4e73df, #1cc88a);">
  <div class="col-11 col-md-6 col-lg-5">
    <div class="card shadow-lg rounded-4 border-0">
      <div class="card-body p-5">
        <!-- Header -->
        <div class="text-center mb-4">
          <h2 class="fw-bold text-primary"><i class="bi bi-shield-lock-fill me-2"></i>Login</h2>
          <p class="text-muted small">Access your E-Police dashboard</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input name="username" class="form-control form-control-lg shadow-sm" placeholder="Enter your username" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input name="password" type="password" class="form-control form-control-lg shadow-sm" placeholder="Enter your password" required>
          </div>

          <!-- Forgot Password -->
          <div class="mb-3 text-end">
            <a href="{{ url_for('forgot_password') }}" class="small text-primary text-decoration-none fw-semibold">Forgot Password?</a>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">IMEI (optional)</label>
            <input name="imei" class="form-control form-control-lg shadow-sm" placeholder="Device IMEI (if binding)">
            <div class="small text-muted mt-1">Enter IMEI if your account is device-bound.</div>
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold" type="submit">Login</button>
        </form>

        <hr class="my-4">

        <!-- Register Link -->
        <div class="text-center">
          <span class="small text-muted">Don't have an account? </span>
          <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Create one</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Optional: Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
