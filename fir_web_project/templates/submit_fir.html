{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-start py-5" style="background: linear-gradient(135deg, #4e73df, #1cc88a); min-height:100vh;">
  <div class="col-12 col-md-8 col-lg-7">
    <div class="card shadow-lg rounded-4 border-0">
      <div class="card-body p-5">
        <!-- Header -->
        <div class="text-center mb-4">
          <h2 class="fw-bold text-primary"><i class="bi bi-file-earmark-text-fill me-2"></i>Submit FIR</h2>
          <p class="text-muted small">Provide details about your complaint</p>
        </div>

        <form method="POST" enctype="multipart/form-data" onsubmit="return attachLocationIfChecked(event)">

          <!-- Complainant Info -->
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" name="name" value="{{ user.name or '' }}" class="form-control form-control-lg shadow-sm" placeholder="Name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Father's Name</label>
              <input type="text" name="father_name" value="{{ user.father_name or '' }}" class="form-control form-control-lg shadow-sm" placeholder="Father's Name">
            </div>
          </div>

          <div class="row g-3 mt-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Mobile</label>
              <input type="text" name="mobile" value="{{ user.mobile or '' }}" class="form-control form-control-lg shadow-sm" placeholder="Mobile No.">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" value="{{ user.email or '' }}" class="form-control form-control-lg shadow-sm" placeholder="Email">
            </div>
          </div>

          <!-- Address -->
          <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">Address</label>
            <textarea name="address" class="form-control form-control-lg shadow-sm" rows="2" placeholder="Enter your address" required>{{ user.address or '' }}</textarea>
          </div>

          <!-- State & District -->
          <div class="row g-3 mt-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">State</label>
              <input type="text" name="state" value="Tamil Nadu" class="form-control form-control-lg shadow-sm" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">District</label>
              <select name="district" class="form-select form-select-lg shadow-sm" required>
                <option value="">-- Select District --</option>
                <option value="Ariyalur">Ariyalur</option>
                <option value="Chengalpattu">Chengalpattu</option>
                <option value="Chennai">Chennai</option>
                <option value="Coimbatore">Coimbatore</option>
                <option value="Cuddalore">Cuddalore</option>
                <option value="Dharmapuri">Dharmapuri</option>
                <option value="Dindigul">Dindigul</option>
                <option value="Erode">Erode</option>
                <option value="Kallakurichi">Kallakurichi</option>
                <option value="Kanchipuram">Kanchipuram</option>
                <option value="Kanyakumari">Kanyakumari</option>
                <option value="Karur">Karur</option>
                <option value="Krishnagiri">Krishnagiri</option>
                <option value="Madurai">Madurai</option>
                <option value="Mayiladuthurai">Mayiladuthurai</option>
                <option value="Nagapattinam">Nagapattinam</option>
                <option value="Namakkal">Namakkal</option>
                <option value="Nilgiris">Nilgiris</option>
                <option value="Perambalur">Perambalur</option>
                <option value="Pudukkottai">Pudukkottai</option>
                <option value="Ramanathapuram">Ramanathapuram</option>
                <option value="Ranipet">Ranipet</option>
                <option value="Salem">Salem</option>
                <option value="Sivaganga">Sivaganga</option>
                <option value="Tenkasi">Tenkasi</option>
                <option value="Thanjavur">Thanjavur</option>
                <option value="Theni">Theni</option>
                <option value="Thoothukudi">Thoothukudi</option>
                <option value="Tiruchirappalli">Tiruchirappalli</option>
                <option value="Tirunelveli">Tirunelveli</option>
                <option value="Tirupathur">Tirupathur</option>
                <option value="Tiruppur">Tiruppur</option>
                <option value="Tiruvallur">Tiruvallur</option>
                <option value="Tiruvannamalai">Tiruvannamalai</option>
                <option value="Tiruvarur">Tiruvarur</option>
                <option value="Vellore">Vellore</option>
                <option value="Viluppuram">Viluppuram</option>
                <option value="Virudhunagar">Virudhunagar</option>
              </select>
            </div>
          </div>

          <!-- FIR Details -->
          <div class="mb-3 mt-4">
            <label class="form-label fw-semibold">Subject</label>
            <input type="text" name="subject" class="form-control form-control-lg shadow-sm" placeholder="Subject of FIR" required>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Occurrence Date</label>
              <input type="date" name="occurrence_date" class="form-control form-control-lg shadow-sm">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Place of Occurrence</label>
              <input type="text" name="place_of_occurrence" class="form-control form-control-lg shadow-sm" placeholder="Place of Occurrence">
            </div>
          </div>

          <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">IMEI</label>
            <input type="text" name="imei" value="{{ user.imei or '' }}" class="form-control form-control-lg shadow-sm" placeholder="IMEI (optional)">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control form-control-lg shadow-sm" placeholder="Describe the incident" rows="4" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Upload Multimedia (optional)</label>
            <input type="file" name="multimedia" class="form-control form-control-lg shadow-sm" multiple>
          </div>

          <!-- Optional Location -->
          <div class="form-check mb-3">
            <input type="checkbox" id="include_location" class="form-check-input">
            <label for="include_location" class="form-check-label fw-semibold">Include my current location with this FIR</label>
          </div>
          <p id="locationStatus" class="small text-muted"></p>

          <!-- Hidden inputs for location -->
          <input type="hidden" name="latitude" id="latitude">
          <input type="hidden" name="longitude" id="longitude">

          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-3">Submit FIR</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script>
function attachLocationIfChecked(event) {
  const includeLoc = document.getElementById("include_location").checked;
  const statusEl = document.getElementById("locationStatus");

  if (!includeLoc) return true;

  if (!navigator.geolocation) {
    statusEl.textContent = "Geolocation not supported by your browser.";
    return false;
  }

  statusEl.textContent = "Fetching location...";
  event.preventDefault();

  navigator.geolocation.getCurrentPosition(function(pos) {
    document.getElementById("latitude").value = pos.coords.latitude;
    document.getElementById("longitude").value = pos.coords.longitude;
    statusEl.textContent = "Location attached.";
    event.target.submit();
  }, function(err) {
    statusEl.textContent = "Unable to get location: " + (err.message || "permission denied");
  }, { enableHighAccuracy: true, timeout: 10000 });

  return false;
}
</script>
{% endblock %}
