{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100" 
style="background: linear-gradient(135deg, #4e73df, #1cc88a);">
      <div class="card shadow-lg rounded-4 border-0">
      <div class="card-body p-5">
        <!-- Header -->
        <div class="text-center mb-4">
          <h2 class="fw-bold text-success"><i class="bi bi-person-plus-fill me-2"></i>Register</h2>
          <p class="text-muted small">Create your E-Police account</p>
        </div>

        <!-- Registration Form -->
        <form method="POST" action="{{ url_for('register') }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Username</label>
              <input name="username" class="form-control form-control-lg shadow-sm" placeholder="Enter username" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Role</label>
              <select name="role" class="form-select form-select-lg shadow-sm" required>
                <option value="complainant">Complainant</option>
                <option value="police">Police</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>

          <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">Email</label>
            <input name="email" type="email" class="form-control form-control-lg shadow-sm" placeholder="Enter email" required>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <input name="password" type="password" class="form-control form-control-lg shadow-sm" placeholder="Enter password" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm Password</label>
              <input name="confirm_password" type="password" class="form-control form-control-lg shadow-sm" placeholder="Confirm password" required>
            </div>
          </div>

          <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">IMEI (optional)</label>
            <input name="imei" class="form-control form-control-lg shadow-sm" placeholder="Bind account to device IMEI">
            <div class="small text-muted mt-1">If provided, account will be locked to this device IMEI.</div>
          </div>

          <button class="btn btn-success btn-lg w-100 fw-bold mt-3" type="submit">Register</button>
        </form>

        <hr class="my-4">

        <!-- Login Link -->
        <div class="text-center">
          <span class="small text-muted">Already have an account? </span>
          <a href="{{ url_for('login') }}" class="text-success fw-semibold text-decoration-none">Login here</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Optional: Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
