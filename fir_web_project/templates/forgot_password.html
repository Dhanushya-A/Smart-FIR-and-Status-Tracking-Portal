{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100" style="background: linear-gradient(135deg, #4e73df, #1cc88a);">
  <div class="col-11 col-md-6 col-lg-5">
    <div class="card shadow-lg rounded-4 border-0">
      <div class="card-body p-5">
        <!-- Header -->
        <div class="text-center mb-4">
          <h2 class="fw-bold text-primary"><i class="bi bi-key-fill me-2"></i>Reset Password</h2>
          <p class="text-muted small">Enter your username and new password</p>
        </div>

        <!-- Reset Password Form -->
        <form method="POST" action="{{ url_for('forgot_password') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input name="username" type="text" pattern="[A-Za-z0-9]+"
                   title="Letters and numbers only" class="form-control form-control-lg shadow-sm" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input name="password" type="password" class="form-control form-control-lg shadow-sm" placeholder="Enter new password" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input name="confirm_password" type="password" class="form-control form-control-lg shadow-sm" placeholder="Confirm new password" required>
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold mt-3" type="submit">Set New Password</button>
        </form>

        <hr class="my-4">

        <!-- Back to Login -->
        <div class="text-center">
          <span class="small text-muted">Remembered your password? </span>
          <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Login here</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Optional: Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
